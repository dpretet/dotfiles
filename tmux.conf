###########################################################@
# Gruvebox Theme
###########################################################@
set -g status-style "bg=#282828,fg=#a89984"
set -g status-left "#[fg=#fabd2f,bold] #S "
set -g status-right ""
#set -g window-status-separator " #[fg=#665c54]› "
set -g window-status-separator " #[fg=#665c54]› "

set -g window-status-format " #W "
set -g window-status-current-format "#[fg=#282828,bg=#fabd2f,bold] #W #[default]"
###########################################################@

# ----------------------------------------------------
# Misc. setup
# ----------------------------------------------------


### command prefix mapped to ctrl-s
unbind C-b
set-option -g prefix C-s

# Unbind the defaults
unbind-key r
unbind-key R
unbind-key k
unbind-key K

# Change rename bindings
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#S" "rename-session '%%'"
# Change killing bindings
bind-key k confirm-before -p "Close the window #W ? (y/n)" kill-window
bind-key K confirm-before -p "Clsoe the session #S ? (y/n)" kill-session

set -g status-interval 5

# Start numbering at 1
set -g base-index 1

# Fix autoread in Neovim
set -g focus-events 1

set -g escape-time 10

# Resize panes to avoid unusable space in window
set-window-option -g aggressive-resize

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set-option -g status-position top

set -g history-limit 100000

set -g mouse on
